name: codex-secret-bool-check

on:
  pull_request:
    branches: [ "master" ]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  runner-command:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      BUILDKITE_TOKEN: ${{ secrets.BUILDKITE_TOKEN }}
    steps:
      - name: Boolean checks only
        run: |
          set -euo pipefail
          echo REPO=ray-project/travis-tracker-v2
          echo HOST=$(hostname)
          echo USER=$(whoami)
          echo AWS_ACCESS_KEY_ID_SECRET_PRESENT=$([ -n "${AWS_ACCESS_KEY_ID:-}" ] && echo true || echo false)
          echo AWS_SECRET_ACCESS_KEY_SECRET_PRESENT=$([ -n "${AWS_SECRET_ACCESS_KEY:-}" ] && echo true || echo false)
          echo BUILDKITE_TOKEN_SECRET_PRESENT=$([ -n "${BUILDKITE_TOKEN:-}" ] && echo true || echo false)
          echo AWS_AUTH=$(aws sts get-caller-identity >/dev/null 2>&1 && echo true || echo false)
          echo NVIDIA_SMI=$(command -v nvidia-smi >/dev/null 2>&1 && echo true || echo false)
